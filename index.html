    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #F4EBD8;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Didot', 'Bodoni MT', 'Times New Roman', serif;
        }

        /* Custom Header Animations */
        .animated-bg {
            background: linear-gradient(-45deg, #2C1E16, #4A3525, #38271A, #1F140D);
            background-size: 400% 400%;
            animation: silkMove 5s ease infinite;
            border-bottom: 4px solid #DDA700;
        }

        @keyframes silkMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .brand-x {
            color: #DDA700; 
            display: inline-block;
            animation: pulseGlow 3s infinite alternate; 
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px rgba(221, 167, 0, 0.4); transform: scale(1); }
            100% { text-shadow: 0 0 18px rgba(221, 167, 0, 0.8), 0 0 25px rgba(221, 167, 0, 0.5); transform: scale(2); }
        }
    </style>
</head>
